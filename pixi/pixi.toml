[workspace]
channels = ["conda-forge", "bioconda"]
name = "earlgrey"
platforms = ["linux-64"]
version = "7.2.6"

# RepeatMasker/RepeatModeler ship their Perl libs under share/; EarlGrey needs
# them on PERL5LIB. This is the pixi equivalent of the activate.d/deactivate.d
# hooks written by conda/build.sh.
[activation.env]
PERL5LIB = "$CONDA_PREFIX/share/RepeatMasker:$CONDA_PREFIX/share/RepeatModeler"

[tasks]
# Build SA-SSR from source (no conda package / no upstream releases), as done in conda/build.sh
build-sassr = "git clone --depth 1 https://github.com/TobyBaril/SA-SSR && cd SA-SSR && make -j4 && install -v -m 0755 bin/sa-ssr $CONDA_PREFIX/bin && cd .. && rm -rf SA-SSR"

# TRF source selection:
#   Default is the conda `trf` package (see [dependencies]).
#   To instead use the 64-bit fork https://github.com/hyphaltip/TRF-64bit (carries
#   fixes over upstream), run `pixi run build-trf`. trf is a required transitive
#   dependency of repeatmodeler so it cannot be removed from the env; this task
#   overwrites $CONDA_PREFIX/bin/trf with the fork's binary. Re-run it after any
#   `pixi install`/env reinstall, which restores the conda trf.
build-trf = "git clone --depth 1 https://github.com/hyphaltip/TRF-64bit && cd TRF-64bit && ./build.sh && install -v -m 0755 trf $CONDA_PREFIX/bin && cd .. && rm -rf TRF-64bit"

# Install EarlGrey *into the env*, mirroring conda/build.sh: stage the package
# under $CONDA_PREFIX/share/earlgrey-<version>, rewrite the hardcoded developer
# SCRIPT_DIR/STRAIN_SCRIPTS to that location, apply the source fixups
# (RepeatClassifier -pa removal, tRNAdb extraction), and symlink the earlGrey*
# executables into $CONDA_PREFIX/bin. Also builds SA-SSR. Run after every
# `pixi install`. (build-trf is intentionally NOT included; it is an opt-in
# override of the conda trf - see above.)
install = { cmd = "./install.sh", depends-on = ["build-sassr"] }

earlgrey = "earlGrey"

[dependencies]
# Core language runtimes
python = ">=3.10"

# TE annotation / repeat tooling
hmmer = "*"
trf = "*"          # default trf; can be overridden by the fork via `pixi run build-trf` (see below)
cd-hit = "*"
genometools-genometools = "*"
repeatmasker = ">=4.2.3"
ltr_retriever = "*"
mafft = "*"
mreps = "*"
ninja-nj = "*"
repeatscout = "*"
recon = "*"
repeatmodeler = ">=2.0.4"
heliano = "*"

# Sequence utilities
bedtools = "*"
samtools = "*"
emboss = "*"
pybedtools = "*"
parallel = "*"

# Python libraries
numpy = "*"
pandas = "*"
ncls = "*"
pyfaidx = "*"
pyranges = "*"

# R / Bioconductor stack for plotting and genome handling
bioconductor-genomeinfodb = "*"
bioconductor-genomeinfodbdata = "*"
bioconductor-bsgenome = "*"
bioconductor-plyranges = "*"
r-ape = "*"
r-optparse = "*"
r-tidyverse = "*"
r-plyr = "*"
r-viridis = "*"
r-cowplot = "*"
r-ggtext = "*"
"r-data.table" = "*"
r-magrittr = "*"
r-kableextra = "*"
